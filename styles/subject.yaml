# It is recommended not to modify this file,
# as it serves as the initialization file for the node.
#
# Instead, create a copy, place it in the same folder,
# and the iTools Prompt Styler node will read all your style files from there.
#
# Ensure that the formatting is kept the same as in this file.
# Indents in YAML are critical. Ensure proper indentation, as incorrect spacing can cause errors.
#
# Best approach is to copy a block of name, negative_prompt and a prompt and then replace their values
# Note that your text_positive will be added in this part {prompt}
# Adding - name: random will allow the node to pick random name from this file

- name: none
  negative_prompt: ''
  prompt: ''

- name: random
  negative_prompt: ''
  prompt: ''  

- name: alexandra
  negative_prompt: ''
  prompt: A photo of a woman resembling Alexandra, an Italian woman of Caucasian ethnicity with brown eye color and brown hair.
  loras:
    - path: Krea2/subject/alexandra_v1.safetensors
      strength: 1.0
    - path: Krea2/subject/realism_slider.safetensors
      strength: -1.0

- name: alison
  negative_prompt: ''
  prompt: A photo of a woman resembling Alison, an American woman of Caucasian ethnicity with blue eye color and auburn hair.
  loras:
    - path: Krea2/subject/alison_v1.safetensors
      strength: 1.0
    - path: Krea2/subject/realism_slider.safetensors
      strength: 1.0

- name: alyson
  negative_prompt: ''
  prompt: A photo of a woman named Alyson, an Australian woman of Aboriginal ethnicity with brown eyes and blonde dyed hair.
  loras:
    - path: Krea2/subject/alyson_v1.safetensors
      strength: 1.0
    - path: Krea2/subject/realism_slider.safetensors
      strength: -2.5

- name: angelina
  negative_prompt: ''
  prompt: A photo of a woman resembling Angelina, an Colombian woman of Latin ethnicity with green eye color and black hair.
  loras:
    - path: Krea2/subject/angelina_v1.safetensors
      strength: 1.0
    - path: Krea2/subject/realism_slider.safetensors
      strength: 3.0
